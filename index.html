<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Fast Note Taking</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p class="tagline">Capture ideas fast — Personal, Work, Study</p>
  </header>

  <main>
    <section id="add-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Your note</label>
        <input type="text" id="note-input" placeholder="Type your note...">
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section id="notes-section">
      <h2>Your notes</h2>
      <input type="text" id="search-input" placeholder="Search notes...">
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes - Built by Abdulwahabu</p>
  </footer>
</body>
</html>
